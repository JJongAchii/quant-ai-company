name: Quant Company CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'maintenance/**']

permissions:
  contents: read

concurrency:
  group: quant-company-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  service:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: company_test
          POSTGRES_PASSWORD: disposable_ci_password
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U company_test -d postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://company_test:disposable_ci_password@127.0.0.1:5432/postgres
      UV_PYTHON: '3.12'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: false
      - name: Install core dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run --frozen ruff check .
      - name: Regression reproduces on base
        if: startsWith(github.head_ref || github.ref_name, 'maintenance/')
        run: uv run --frozen python scripts/check_maintenance_regression.py
      - name: PostgreSQL, Temporal and service regression tests
        run: >-
          uv run --frozen pytest -q -m 'not live'
          tests deploy/test_deployment_contract.py evals/test_financial_fixtures.py


  codex-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - name: Install the reviewed Linux distribution
        env:
          NPM_CONFIG_PREFIX: ${{ runner.temp }}/company-codex
        run: |
          node deploy/install-codex.cjs src/quant_company/providers/codex_release.json
          echo "$NPM_CONFIG_PREFIX/bin" >> "$GITHUB_PATH"
      - name: Real CLI config and catalog protocol; empty auth, no inference
        env:
          CODEX_CONFIG_PROBE: '1'
          CODEX_CATALOG_PROBE_BIN: ${{ runner.temp }}/company-codex/bin/codex
        run: uv run --frozen pytest -q tests/test_codex_config_probe.py tests/test_model_catalog.py

# No repository/production secrets, model calls, deployments or PR write token.
# qdata integration is separately pinned and verified; core tests need no private checkout.
