<!doctype html><html lang="ko"><meta charset="utf-8"><style>
@font-face{font-family:P;font-weight:800;src:url(fonts/Pretendard-ExtraBold.woff2)}@font-face{font-family:P;font-weight:700;src:url(fonts/Pretendard-Bold.woff2)}
*{margin:0;box-sizing:border-box}body{width:1280px;height:720px;overflow:hidden;font-family:P;word-break:keep-all;color:#FCF1DB;
background:radial-gradient(ellipse 80% 70% at 35% 45%,#0A2A63 0%,#011A43 55%,#00112E 100%)}
.img{position:absolute;right:0;top:0;width:560px;height:620px;background:url({{image}}) center/cover;
-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 35%)}
.badge{position:absolute;left:56px;top:52px;background:#FDC749;color:#011A43;font-weight:800;font-size:34px;padding:10px 22px;border-radius:14px}
/* The question and the stat share one column above the bar, so a longer question pushes the stat down instead of covering
   it (10/14 AM: a third line covered the stat); fit() shrinks the question to two lines inside the column. */
.copy{position:absolute;left:56px;top:150px;width:760px;height:450px;display:flex;flex-direction:column;justify-content:center;gap:24px}
.q{font-size:104px;font-weight:800;line-height:1.12;letter-spacing:-.03em;text-wrap:balance}
.q b{color:#FDC749}.n{padding-left:4px;font-size:40px;font-weight:700;color:#FCF1DB}.n.up{color:#FF5C6C}.n.dn{color:#5EA0FF}
.bar{position:absolute;left:0;right:0;bottom:0;height:100px;background:#00112E;border-top:3px solid #FDC749;display:flex;align-items:center;padding:0 56px;gap:16px;font-size:34px;font-weight:800}
.bar img{height:58px}.bar span{color:#FDC749;font-weight:700;font-size:30px}.s{margin-left:auto;font-size:22px;color:#FF9FB0;font-weight:700}
/* Watched-progress strip along the bottom edge, styled like YouTube's resume bar (owner request 2026-10-12). */
.resume{position:absolute;left:0;right:0;bottom:0;height:12px;background:rgba(255,255,255,.45);z-index:5}
.resume i{display:block;height:100%;width:50%;background:#FF0000}
</style><div class="img"></div><div class="badge">{{date}}</div>
<div class="copy"><div class="q">{{question}}</div><div class="n {{stat_dir}}">{{stat}}</div></div>
<div class="bar"><img src="logo_mark.png">뭐든story<span>{{brand}}</span><div class="s">{{mark}}</div></div>
<div class="resume"><i></i></div>
<script>function fit(){const q=document.querySelector('.q'),box=document.querySelector('.copy');
const lines=()=>Math.round(q.getBoundingClientRect().height/parseFloat(getComputedStyle(q).lineHeight));
for(let s=104;s>56&&(lines()>2||box.scrollHeight>box.clientHeight+1);s-=4)q.style.fontSize=(s-4)+'px';}</script></html>
