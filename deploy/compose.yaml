name: quant-company

x-runtime: &runtime
  restart: unless-stopped
  init: true
  user: "10001:10001"
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 128
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "3"

x-app: &app
  <<: *runtime
  image: quant-company:${RELEASE_COMMIT:-unqualified}
  build:
    context: ..
    dockerfile: deploy/Dockerfile
    target: app
    additional_contexts:
      qdata: ${QDATA_BUILD_CONTEXT:-../../quant-data}
    args:
      RELEASE_COMMIT: ${RELEASE_COMMIT:-unqualified}
      QDATA_COMMIT: ${QDATA_COMMIT:-unqualified}
  volumes:
    - ${STATE_DIR:-/var/lib/quant-company}/config/roles.json:/etc/quant-company/roles.json:ro
  depends_on:
    postgres:
      condition: service_healthy
  stop_grace_period: 360s

x-db-env: &db-env
  DATABASE_PASSWORD_FILE: /run/secrets/database_password
  DATABASE_USER: company
  DATABASE_NAME: ${DATABASE_NAME:-quant_company}
  ROLES_FILE: /etc/quant-company/roles.json
  MODEL_PROVIDER: codex
  COMPANY_LAKE_URI: ${COMPANY_LAKE_URI:-}
  COMPANY_WEB_ENABLED: ${COMPANY_WEB_ENABLED:-true}
  COMPANY_NEWS_ENABLED: ${COMPANY_NEWS_ENABLED:-false}
  NEWS_PUBLISH_ENABLED: ${NEWS_PUBLISH_ENABLED:-false}
  NEWS_SEARCH_ENABLED: ${NEWS_SEARCH_ENABLED:-false}
  NEWS_OPTIMIZATION_ENABLED: ${NEWS_OPTIMIZATION_ENABLED:-false}
  NEWS_DELIVERY_WINDOW_ENABLED: ${NEWS_DELIVERY_WINDOW_ENABLED:-false}
  NEWS_CHANNEL_ID: ${NEWS_CHANNEL_ID:-}
  NEWS_OWNER_USER: ${NEWS_OWNER_USER:-}
  NEWS_MAX_AGE_HOURS: ${NEWS_MAX_AGE_HOURS:-24}
  NEWS_INITIAL_LOOKBACK_MINUTES: ${NEWS_INITIAL_LOOKBACK_MINUTES:-120}
  COMPANY_STAFF_DEVELOPMENT_ENABLED: ${COMPANY_STAFF_DEVELOPMENT_ENABLED:-false}
  STAFF_DAILY_EXERCISES: ${STAFF_DAILY_EXERCISES:-2}
  STAFF_MAX_CALLS_PER_EXERCISE: ${STAFF_MAX_CALLS_PER_EXERCISE:-3}
  STAFF_SCHEDULE_HOUR_KST: ${STAFF_SCHEDULE_HOUR_KST:-3}
  COMPANY_STAFF_REVIEW_ENABLED: ${COMPANY_STAFF_REVIEW_ENABLED:-false}
  STAFF_REVIEW_DAILY_LIMIT: ${STAFF_REVIEW_DAILY_LIMIT:-2}
  COMPANY_MAX_DAILY_TURNS: ${COMPANY_MAX_DAILY_TURNS:-0}
  COMPANY_MAX_TASK_TURNS: ${COMPANY_MAX_TASK_TURNS:-8}
  COMPANY_MAX_DEPTH: ${COMPANY_MAX_DEPTH:-3}

x-temporal-env: &temporal-env
  TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-configure.tmprl.cloud:7233}
  TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-configure.namespace}
  TEMPORAL_TLS: "true"
  TEMPORAL_API_KEY_FILE: /run/secrets/temporal_api_key

services:
  maintenance:
    <<: *app
    profiles: [maintenance]
    image: quant-company-maintenance:${RELEASE_COMMIT:-unqualified}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: maintenance
      additional_contexts:
        qdata: ${QDATA_BUILD_CONTEXT:-../../quant-data}
      args:
        RELEASE_COMMIT: ${RELEASE_COMMIT:-unqualified}
        QDATA_COMMIT: ${QDATA_COMMIT:-unqualified}
    command: [quant-company, maintenance, --config, /etc/quant-company/maintenance.json]
    environment:
      <<: [*db-env, *temporal-env]
      MODEL_RUNTIME_URL: http://codex-runtime:8080
      MODEL_RUNTIME_TOKEN_FILE: /run/secrets/model_runtime_token
      SLACK_ALLOWED_USERS: ${SLACK_ALLOWED_USERS:-[]}
      SLACK_ALLOWED_CHANNELS: ${SLACK_ALLOWED_CHANNELS:-[]}
    volumes:
      - ${STATE_DIR:-/var/lib/quant-company}/config/roles.json:/etc/quant-company/roles.json:ro
      - ${STATE_DIR:-/var/lib/quant-company}/config/maintenance.json:/etc/quant-company/maintenance.json:ro
    secrets: [database_password, model_runtime_token, temporal_api_key, maintenance_github_key]
    networks: [core, model, service_egress]
    mem_limit: ${MAINTENANCE_MEMORY_LIMIT:-128m}
    cpus: 0.25

  caddy:
    <<: *runtime
    profiles: [https]
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    environment:
      COMPANY_DOMAIN: ${COMPANY_DOMAIN:-office.example.invalid}
      ACME_EMAIL: ${ACME_EMAIL:-owner@example.invalid}
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${STATE_DIR:-/var/lib/quant-company}/caddy/data:/data
      - ${STATE_DIR:-/var/lib/quant-company}/caddy/config:/config
    networks: [edge]
    mem_limit: 128m
    cpus: 0.25
    depends_on: [api]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8081/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16.15-bookworm}
    restart: unless-stopped
    environment:
      POSTGRES_DB: quant_company
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/database_admin_password
      PGDATA: /var/lib/postgresql/data/pgdata
    secrets: [database_admin_password, database_password]
    volumes:
      - ${STATE_DIR:-/var/lib/quant-company}/postgres:/var/lib/postgresql/data
      - ./init-database.sh:/docker-entrypoint-initdb.d/10-company.sh:ro
    networks: [core]
    # Entrypoint starts as root to initialize/chown PGDATA, then switches to postgres.
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-512m}
    cpus: 0.75
    shm_size: 128m
    stop_grace_period: 60s
    command: [postgres, -c, "shared_buffers=${POSTGRES_SHARED_BUFFERS:-128MB}", -c, max_connections=40]
    healthcheck:
      # TCP excludes the socket-only temporary server used during first-time initialization.
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: local
      options: {max-size: "10m", max-file: "3"}

  api:
    <<: *app
    command: [quant-company, serve, --host, 0.0.0.0, --port, "8000"]
    environment:
      <<: *db-env
      OPERATOR_TOKEN_FILE: /run/secrets/operator_token
      SLACK_TEAM_ID: ${SLACK_TEAM_ID:-CONFIGURE}
      SLACK_ALLOWED_USERS: ${SLACK_ALLOWED_USERS:-[]}
      SLACK_ALLOWED_CHANNELS: ${SLACK_ALLOWED_CHANNELS:-[]}
      SLACK_CREDENTIALS_FILE: /run/secrets/slack_credentials
    secrets: [database_password, operator_token, slack_credentials]
    # Operator endpoints are reachable through an SSH tunnel, not through Caddy.
    ports: ["127.0.0.1:8000:8000"]
    networks: [edge, core]
    mem_limit: ${API_MEMORY_LIMIT:-256m}
    cpus: 0.5
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  slack-socket:
    <<: *app
    command: [quant-company, slack-socket]
    environment:
      <<: *db-env
      SLACK_TEAM_ID: ${SLACK_TEAM_ID:-CONFIGURE}
      SLACK_ALLOWED_USERS: ${SLACK_ALLOWED_USERS:-[]}
      SLACK_ALLOWED_CHANNELS: ${SLACK_ALLOWED_CHANNELS:-[]}
      SLACK_CREDENTIALS_FILE: /run/secrets/slack_credentials
    secrets: [database_password, slack_credentials]
    networks: [core, service_egress]
    mem_limit: ${SLACK_MEMORY_LIMIT:-256m}
    cpus: 0.5

  worker:
    <<: *app
    command: [quant-company, worker]
    environment:
      <<: [*db-env, *temporal-env]
      MODEL_RUNTIME_URL: http://codex-runtime:8080
      MODEL_RUNTIME_TOKEN_FILE: /run/secrets/model_runtime_token
      AWS_SHARED_CREDENTIALS_FILE: /run/secrets/lake_read_credentials
      AWS_DEFAULT_REGION: ap-northeast-2
      SLACK_ALLOWED_USERS: ${SLACK_ALLOWED_USERS:-[]}
      SLACK_ALLOWED_CHANNELS: ${SLACK_ALLOWED_CHANNELS:-[]}
    secrets: [database_password, temporal_api_key, model_runtime_token, lake_read_credentials]
    networks: [core, model, service_egress]
    mem_limit: ${WORKER_MEMORY_LIMIT:-384m}
    cpus: 0.75
    depends_on:
      postgres: {condition: service_healthy}
      codex-runtime: {condition: service_healthy}

  dispatch:
    <<: *app
    command: [quant-company, dispatch]
    environment:
      <<: [*db-env, *temporal-env]
      SLACK_TEAM_ID: ${SLACK_TEAM_ID:-CONFIGURE}
      SLACK_ALLOWED_USERS: ${SLACK_ALLOWED_USERS:-[]}
      SLACK_ALLOWED_CHANNELS: ${SLACK_ALLOWED_CHANNELS:-[]}
      SLACK_CREDENTIALS_FILE: /run/secrets/slack_credentials
    secrets: [database_password, temporal_api_key, slack_credentials]
    networks: [core, service_egress]
    mem_limit: ${DISPATCH_MEMORY_LIMIT:-256m}
    cpus: 0.5

  codex-runtime:
    <<: *runtime
    image: quant-company-codex:${RELEASE_COMMIT:-unqualified}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: codex
      additional_contexts:
        qdata: ${QDATA_BUILD_CONTEXT:-../../quant-data}
      args:
        RELEASE_COMMIT: ${RELEASE_COMMIT:-unqualified}
        QDATA_COMMIT: ${QDATA_COMMIT:-unqualified}
    environment:
      CODEX_HOME: /state/auth
      CODEX_BIN: codex
      CODEX_JOBS_DIR: /state/jobs
      CODEX_TIMEOUT_SECONDS: "300"
      WEB_CONCURRENCY: "1"
      WORKERS: "1"
      MODEL_RUNTIME_TOKEN_FILE: /run/secrets/model_runtime_token
    secrets: [model_runtime_token]
    volumes:
      - ${STATE_DIR:-/var/lib/quant-company}/codex/auth:/state/auth
      - ${STATE_DIR:-/var/lib/quant-company}/codex/jobs:/state/jobs
    networks: [model, model_egress]
    mem_limit: ${CODEX_MEMORY_LIMIT:-1g}
    cpus: 1.0
    stop_grace_period: 360s
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  claude-runtime:
    <<: *runtime
    profiles: [claude]
    image: quant-company-claude:${RELEASE_COMMIT:-unqualified}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: claude
      additional_contexts:
        qdata: ${QDATA_BUILD_CONTEXT:-../../quant-data}
      args:
        RELEASE_COMMIT: ${RELEASE_COMMIT:-unqualified}
        QDATA_COMMIT: ${QDATA_COMMIT:-unqualified}
    environment:
      CLAUDE_CONFIG_DIR: /state/auth
      CLAUDE_JOBS_DIR: /state/jobs
      CLAUDE_USAGE_CREDITS_DISABLED_CONFIRMED: ${CLAUDE_USAGE_CREDITS_DISABLED_CONFIRMED:-false}
      MODEL_RUNTIME_TOKEN_FILE: /run/secrets/model_runtime_token
    secrets: [model_runtime_token]
    volumes:
      - ${STATE_DIR:-/var/lib/quant-company}/claude/auth:/state/auth
      - ${STATE_DIR:-/var/lib/quant-company}/claude/jobs:/state/jobs
    networks: [model, model_egress]
    mem_limit: ${CLAUDE_MEMORY_LIMIT:-512m}
    cpus: 0.75
    stop_grace_period: 360s
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

networks:
  edge: {}
  core:
    internal: true
  model:
    internal: true
  service_egress: {}
  model_egress: {}

secrets:
  maintenance_github_key:
    file: ${STATE_DIR:-/var/lib/quant-company}/secrets/maintenance_github_key
  database_admin_password:
    file: ${STATE_DIR:-/var/lib/quant-company}/secrets/database_admin_password
  database_password:
    file: ${STATE_DIR:-/var/lib/quant-company}/secrets/database_password
  operator_token:
    file: ${STATE_DIR:-/var/lib/quant-company}/secrets/operator_token
  model_runtime_token:
    file: ${STATE_DIR:-/var/lib/quant-company}/secrets/model_runtime_token
  temporal_api_key:
    file: ${STATE_DIR:-/var/lib/quant-company}/secrets/temporal_api_key
  slack_credentials:
    file: ${STATE_DIR:-/var/lib/quant-company}/secrets/slack-credentials.json
  lake_read_credentials:
    file: ${STATE_DIR:-/var/lib/quant-company}/secrets/lake_read_credentials
