# Apply after review alongside compose.yaml. Migrate first and provision the token/artifact directory.
# The base company deploy stays unchanged until this explicit overlay is enabled.
#
# COMPANY_CODE_COMMIT on the research-facing services is the company release registered on the research worker,
# not the code these containers run (that is the image's org.opencontainers.image.revision). Research jobs record
# it and the worker resolves only registered releases (research/releases.py), so it moves only when the operator
# registers a new release there.
x-research-release: &research-release
  COMPANY_CODE_COMMIT: ${RESEARCH_RELEASE_COMMIT:?Set the company release registered on the research worker}

# Research planning (docs/project/RESEARCH-PLANNING-SHADOW-RUNBOOK-20261014.md) stays off until runtime.env turns it
# on. Both values go to every research-facing service so drafting, approval and the stage tick agree; Settings
# rejects planning stages on a service without the durable research service.
x-research-planning: &research-planning
  RESEARCH_PLANNING_ENABLED: ${RESEARCH_PLANNING_ENABLED:-false}
  RESEARCH_PLANNING_STAGES_ENABLED: ${RESEARCH_PLANNING_STAGES_ENABLED:-false}

services:
  api:
    environment:
      <<: [*research-release, *research-planning]
      COMPANY_RESEARCH_ENABLED: "true"
      RESEARCH_WORKER_TOKEN_FILE: /run/secrets/research_worker_token
      RESEARCH_ARTIFACT_DIR: /state/research
    volumes:
      - ${STATE_DIR:-/var/lib/quant-company}/research:/state/research
    secrets:
      - research_worker_token
  slack-socket:
    environment:
      <<: [*research-release, *research-planning]
      COMPANY_RESEARCH_ENABLED: "true"
  worker:
    environment:
      <<: [*research-release, *research-planning]
      COMPANY_RESEARCH_ENABLED: "true"
      RESEARCH_ARTIFACT_DIR: /state/research
      RESEARCH_REPORT_BUCKET: ${RESEARCH_REPORT_BUCKET:?Set the existing approved backup bucket}
      RESEARCH_REPORT_PREFIX: company/research/executions
      RESEARCH_S3_CREDENTIALS_FILE: /run/secrets/research_backup_aws
    volumes:
      - ${STATE_DIR:-/var/lib/quant-company}/research:/state/research
    secrets:
      - research_backup_aws
  data-watch-worker:
    environment:
      <<: *research-planning
      COMPANY_RESEARCH_ENABLED: "true"
  dispatch:
    environment:
      <<: *research-planning
      COMPANY_RESEARCH_ENABLED: "true"
secrets:
  research_worker_token:
    file: ${STATE_DIR:-/var/lib/quant-company}/secrets/research-worker-token
  research_backup_aws:
    file: ${STATE_DIR:-/var/lib/quant-company}/secrets/research-backup-aws.json
