[project]
name = "quant-company"
version = "0.1.0"
description = "Persistent, subscription-first quant research company"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "psycopg[binary]>=3.2,<4",
  "temporalio>=1.9,<2",
  "slack-sdk>=3.38,<4",
  "aiohttp>=3.12,<4",
  "pypdf==6.18.0",
]

[project.optional-dependencies]
lake = ["qdata[s3]"]

[tool.uv.sources]
qdata = { path = "../quant-data" }

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[project.scripts]
quant-company = "quant_company.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quant_company"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires real PostgreSQL or Temporal", "live: explicitly enabled real subscription call"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
